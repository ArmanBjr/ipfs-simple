name: CI - Python
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create venv
        run: python -m venv .venv

      - name: Install deps
        run: |
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r gateway/requirements.txt

      - name: Run tests
        run: |
          . .venv/bin/activate
          cd gateway
          pytest -v
